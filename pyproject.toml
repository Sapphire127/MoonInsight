[project]
name = "moon-insight"
version = "0.1.0"
description = "Financial assistant agent — reference implementation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moon_insight*"]

[tool.pytest.ini_options]
testpaths = ["_tests_"]
